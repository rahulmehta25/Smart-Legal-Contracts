# Arbitration Clause Detection RAG System Configuration

# Model Configuration
models:
  legal_bert:
    name: "nlpaueb/legal-bert-base-uncased"
    max_length: 512
    confidence_threshold: 0.7
  
  spacy:
    model: "en_core_web_sm"
    disable: ["ner", "parser"]

# Detection Configuration
detection:
  pattern_matching:
    enabled: true
    min_confidence: 0.3
  
  semantic_analysis:
    enabled: true
    weight: 0.7
  
  document_analysis:
    max_sections: 10
    section_threshold: 0.3

# Database Configuration
database:
  type: "sqlite"  # sqlite, postgresql, mysql
  url: "sqlite:///arbitration_clauses.db"
  
  # PostgreSQL example:
  # type: "postgresql"
  # url: "postgresql://user:pass@localhost/arbitration"
  
  # MySQL example:
  # type: "mysql"
  # url: "mysql://user:pass@localhost/arbitration"

# Vector Store Configuration
vector_store:
  type: "faiss"  # faiss, simple
  dimension: 768
  similarity_metric: "cosine"
  max_results: 10

# Caching Configuration
caching:
  enabled: true
  redis:
    host: "localhost"
    port: 6379
    db: 0
    ttl: 86400  # 24 hours

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: true
  
  # CORS settings
  cors:
    origins: ["*"]
    methods: ["GET", "POST", "PUT", "DELETE"]
    headers: ["*"]

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/arbitration_detection.log"
  
  # Log rotation
  rotation:
    max_size: "10MB"
    max_files: 5

# Performance Configuration
performance:
  batch_size: 10
  max_workers: 4
  timeout: 30
  
  # Memory limits
  max_memory: "4GB"
  max_document_size: "50MB"

# Security Configuration
security:
  # API key authentication (optional)
  api_key_enabled: false
  api_key_header: "X-API-Key"
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
  
  # File upload restrictions
  upload:
    allowed_extensions: [".pdf", ".txt", ".doc", ".docx"]
    max_file_size: "10MB"

# Monitoring Configuration
monitoring:
  enabled: true
  
  # Metrics collection
  metrics:
    - "detection_accuracy"
    - "processing_time"
    - "api_response_time"
    - "error_rate"
  
  # Health checks
  health_checks:
    - "database_connection"
    - "model_loading"
    - "vector_store"
    - "cache_connection"

# Development Configuration
development:
  debug: false
  testing: false
  
  # Model download
  auto_download_models: true
  
  # Hot reload
  hot_reload: true
